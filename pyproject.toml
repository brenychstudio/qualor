[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qualor"
version = "0.0.1"
description = "QUALOR — Autonomous Opportunity Intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "typer>=0.12,<1",
    "strands-agents>=1,<2",
    "boto3>=1.35,<2",
    "httpx>=0.27,<1",
    "tzdata>=2025.2,<2027",
]

[project.scripts]
qualor = "qualor.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qualor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["archived_source: requires the locally archived hash-bound official source"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
